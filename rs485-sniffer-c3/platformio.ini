; Sniffer RS485 - ESP32-C3
;   Super Mini (niebieska dioda):        pio run -e usb -t upload      / pio run -e ota -t upload
;   Super Mini Plus (antena + WS2812):   pio run -e usb-rgb -t upload  / pio run -e ota-rgb -t upload
;   pierwsze wgranie zawsze przez USB, kolejne mogą iść przez Wi-Fi (OTA)

[env]
platform      = espressif32
board         = esp32-c3-devkitm-1
framework     = arduino

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DUSBSerial=Serial

; dwie partycje aplikacji po 1,9 MB - wymagane przez OTA
board_build.partitions = min_spiffs.csv

monitor_speed = 115200

lib_deps =
    BLE

[ota]
upload_protocol = espota
upload_flags =
    --port=3232
    --auth=rs485ota

; ── Super Mini ───────────────────────────────────────────
[env:usb]
upload_speed  = 921600

[env:ota]
extends         = ota
; IP ESP w Twojej sieci (albo rs485-pro-ble.local, jeśli mDNS działa w sieci)
upload_port     = 10.100.21.156

; ── Super Mini Plus: dioda RGB WS2812 na GPIO8 ───────────
[env:usb-rgb]
build_flags   = ${env.build_flags} -DLED_RGB=1 -DWIFI_TX_POWER=WIFI_POWER_17dBm
upload_speed  = 921600

[env:ota-rgb]
extends         = ota
build_flags     = ${env.build_flags} -DLED_RGB=1 -DWIFI_TX_POWER=WIFI_POWER_17dBm
; wpisz IP nowego modułu
upload_port     = 10.100.21.233
