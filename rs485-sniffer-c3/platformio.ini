; Sniffer RS485 - ESP32-C3 Super Mini
;   pierwsze wgranie (USB):     pio run -e usb -t upload
;   kolejne aktualizacje (Wi-Fi): pio run -e ota -t upload

[env]
platform      = espressif32
board         = esp32-c3-devkitm-1
framework     = arduino

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DUSBSerial=Serial

; dwie partycje aplikacji po 1,9 MB - wymagane przez OTA
board_build.partitions = min_spiffs.csv

monitor_speed = 115200

lib_deps =
    BLE

[env:usb]
upload_speed  = 921600

[env:ota]
upload_protocol = espota
; IP ESP w Twojej sieci (albo rs485-pro-ble.local, jeśli mDNS działa w sieci)
upload_port     = 10.100.21.156
upload_flags =
    --port=3232
    --auth=rs485ota
